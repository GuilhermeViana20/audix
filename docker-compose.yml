services:
  app:
    build: .
    container_name: audix-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - audix

  nginx:
    image: nginx:1.27-alpine
    container_name: audix-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - audix

  mysql:
    image: mysql:8.4
    container_name: audix-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_troque_esta}
      MYSQL_DATABASE: audix
      MYSQL_USER: audix
      MYSQL_PASSWORD: ${DB_PASSWORD:-troque_esta_senha}
      TZ: America/Fortaleza
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - audix-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_troque_esta"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - audix

volumes:
  audix-mysql-data:

networks:
  audix:
